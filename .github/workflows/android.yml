name: Android

# 分支出包：编 debug APK，挂 Actions artifact 供手动检查。
# 手动触发：build_type=release 时用 secrets 中的正式密钥签 release 包，
# 只挂 artifact（含 sha256 与 mapping.txt），不创建 GitHub Release。
# 打 tag（v*）：编 release APK，挂到 GitHub Release，作为发版下载源。
# 一键发版见 deploy/release.sh（打 tag → 等 CI → 下载 → 镜像到 B 机）。
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型；release 只在分支上手动出包，不发布 GitHub Release"
        type: choice
        options:
          - debug
          - release
        default: debug

# tag 构建完成后要把 APK 挂到 GitHub Release。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 与 flux 的 Android 流程保持一致：镜像自带 SDK，但 cmdline-tools 版本与
      # setup-android@v3 预期不一致，会卡在非交互 --licenses，故直接用镜像里的 sdkmanager。
      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "${SDKMANAGER}" --licenses > /dev/null
          "${SDKMANAGER}" "platforms;android-34" "build-tools;34.0.0"

      # keystore 不进仓库。分支出包与 tag 发版都还原同一把密钥，
      # 否则每次 CI 随机生成的调试密钥会让新包无法覆盖安装旧包。
      - name: Restore signing keystore
        if: github.event_name != 'pull_request'
        env:
          FLUXBOT_KEYSTORE_BASE64: ${{ secrets.FLUXBOT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FLUXBOT_KEYSTORE_BASE64" ]; then
            if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
              echo "::error::缺少 secrets.FLUXBOT_KEYSTORE_BASE64，无法签出可安装的 release 包"
              exit 1
            fi
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.build_type }}" = "release" ]; then
              echo "::error::手动发布 release 需要 secrets.FLUXBOT_KEYSTORE_BASE64 与签名口令"
              exit 1
            fi
            echo "::warning::未配置 FLUXBOT_KEYSTORE_BASE64，debug 包将退回默认调试签名"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$FLUXBOT_KEYSTORE_BASE64" | base64 -d > keystore/fluxbot-release.jks

      - name: Assemble debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release') }}
        env:
          FLUXBOT_KEYSTORE_PATH: ${{ github.workspace }}/keystore/fluxbot-release.jks
          FLUXBOT_KEYSTORE_PASSWORD: ${{ secrets.FLUXBOT_KEYSTORE_PASSWORD }}
          FLUXBOT_KEY_ALIAS: ${{ secrets.FLUXBOT_KEY_ALIAS }}
          FLUXBOT_KEY_PASSWORD: ${{ secrets.FLUXBOT_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Assemble release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release') }}
        env:
          FLUXBOT_KEYSTORE_PATH: ${{ github.workspace }}/keystore/fluxbot-release.jks
          FLUXBOT_KEYSTORE_PASSWORD: ${{ secrets.FLUXBOT_KEYSTORE_PASSWORD }}
          FLUXBOT_KEY_ALIAS: ${{ secrets.FLUXBOT_KEY_ALIAS }}
          FLUXBOT_KEY_PASSWORD: ${{ secrets.FLUXBOT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify release APK signing key
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' }}
        env:
          FLUXBOT_KEYSTORE_PASSWORD: ${{ secrets.FLUXBOT_KEYSTORE_PASSWORD }}
          FLUXBOT_KEY_ALIAS: ${{ secrets.FLUXBOT_KEY_ALIAS }}
        run: |
          KEYSTORE="keystore/fluxbot-release.jks"
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if [ ! -f "$KEYSTORE" ]; then
            echo "::error::keystore 未还原，拒绝发布未签名的 release APK"
            exit 1
          fi
          if [ ! -f "$APK" ]; then
            echo "::error::assembleRelease 未产出 app-release.apk"
            exit 1
          fi
          CERT_SHA="$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -1 | tr -d ':\r' | tr 'a-f' 'A-F')"
          EXPECTED_SHA="$(keytool -exportcert -keystore "$KEYSTORE" -alias "$FLUXBOT_KEY_ALIAS" \
            -storepass "$FLUXBOT_KEYSTORE_PASSWORD" 2>/dev/null \
            | sha256sum | cut -d' ' -f1 | tr 'a-f' 'A-F')"
          if [ -z "$CERT_SHA" ] || [ "$CERT_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::release APK 的签名证书与 FLUXBOT_KEY_ALIAS 不匹配"
            echo "APK cert: ${CERT_SHA:-<none>}"
            echo "keystore cert: ${EXPECTED_SHA:-<none>}"
            exit 1
          fi
          echo "release APK 已使用 secret 中的正式密钥签名（SHA-256 ${CERT_SHA}）"

      - name: Compute release artifact name
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' }}
        run: echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Stage release checksum
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          cp "$APK" app-release.apk
          sha256sum app-release.apk | awk '{print $1"  app-release.apk"}' > app-release.apk.sha256

      - name: Upload debug APK
        if: ${{ startsWith(github.ref, 'refs/heads/') && github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release') }}
        uses: actions/upload-artifact@v4
        with:
          name: fluxbot-debug-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 手动 release 只挂 artifact，不创建 GitHub Release；tag 发版逻辑保持不变。
      - name: Upload dispatch release APK
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: fluxbot-release-${{ github.ref_name }}-${{ env.SHORT_SHA }}
          path: |
            app-release.apk
            app-release.apk.sha256
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload release mapping
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: fluxbot-mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      # Release 资产走 objects.githubusercontent.com，下载速度远高于 Actions artifact；
      # deploy/release.sh 就从这里取包再镜像给 B 机。
      - name: Publish APK to GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VC=$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)
          VN=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          OUT="fluxbot-${VN}-vc${VC}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$OUT" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$OUT" --repo "$GITHUB_REPOSITORY" \
              --title "FluxBot ${VN} (vc${VC})" \
              --notes "FluxBot ${VN}（versionCode ${VC}）"
          fi
