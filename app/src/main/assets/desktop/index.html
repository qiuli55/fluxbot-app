<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bot 桌面</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0d12; overflow: hidden;
    font: 13px/1.4 -apple-system, "Noto Sans SC", system-ui, sans-serif;
    color: #e8eaef;
  }
  /* 舞台：固定在可见视口上，所有浮层都以它为基准定位。
     之前浮层直接挂在 body 上，页面尺寸一旦算错，底部工具条就跑到屏幕外看不见。 */
  #stage {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    overflow: hidden; background: #0b0d12;
  }
  /* 不用 inset：部分 WebView 不支持，绝对定位元素会退化成 0 尺寸，
     noVNC 的 autoscale 就会算出 scale=0（画布 css 0px，屏幕全黑）。 */
  #screen {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #screen canvas { image-rendering: auto; }

  .pill {
    position: absolute; left: 12px; top: 12px; z-index: 20;
    max-width: 62%;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(12, 14, 20, .78);
    border: 1px solid rgba(255, 255, 255, .10);
    color: #cfd4de; font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    backdrop-filter: blur(8px);
  }
  .pill.ok { color: #7fe0a8; border-color: rgba(127, 224, 168, .3); }
  .pill.err { color: #ff8f8f; border-color: rgba(255, 143, 143, .34); }

  /* 居中连接动画：画面未就绪时显示，连上就隐藏。
     不用百分比：部分 WebView 里绝对定位元素的 100% 会退化成 0，
     容器高度为 0 时 flex 居中会把转圈挤出视口、文字贴到顶部。
     vw/vh 兜底，实际尺寸由 JS 用 px 写死（同 #screen 的做法）。 */
  #loading {
    position: absolute; top: 0; left: 0;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 18; pointer-events: none;
  }
  #loading.hide { display: none; }
  .spin {
    width: 38px; height: 38px; border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, .13);
    border-top-color: #5b8cff;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingText { font-size: 12.5px; color: #9aa3b2; }

  #control {
    position: absolute; right: 12px; top: 10px; z-index: 21;
    padding: 8px 16px; border-radius: 999px; border: 0;
    background: #2f6df6; color: #fff; font-size: 12.5px; font-weight: 600;
    box-shadow: 0 6px 18px rgba(47, 109, 246, .34);
  }
  #control.on { background: rgba(12, 14, 20, .8); border: 1px solid rgba(255,255,255,.16); color: #cfd4de; box-shadow: none; }

  /* 悬浮球：点一下展开工具面板，可拖动到顺手的位置。
     用 position:fixed，位置只由 JS 的 left/top 决定，不受页面高度计算影响。 */
  #fab {
    position: fixed; z-index: 24; right: 14px; bottom: calc(96px + env(safe-area-inset-bottom));
    left: auto; top: auto;
    width: 50px; height: 50px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, .18);
    background: rgba(47, 109, 246, .95); color: #fff;
    box-shadow: 0 10px 24px rgba(0, 0, 0, .45);
    touch-action: none; -webkit-user-select: none; user-select: none;
    transition: transform .16s ease, background .16s ease;
  }
  #fab.show { display: flex; }
  #fab:active { transform: scale(.93); }
  #fab.open { background: rgba(18, 22, 30, .96); border-color: rgba(255, 255, 255, .22); }
  #fab svg {
    width: 23px; height: 23px; stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  #fab .x { display: none; }
  #fab.open .x { display: block; }
  #fab.open .main { display: none; }

  /* 工具面板：悬浮在球旁边，4 列图标网格 */
  #tools {
    position: fixed; z-index: 23; width: 246px;
    display: none; padding: 9px;
    max-height: calc(100vh - 16px); overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 16px;
    background: rgba(12, 15, 21, .96);
    border: 1px solid rgba(255, 255, 255, .10);
    box-shadow: 0 16px 40px rgba(0, 0, 0, .5);
    backdrop-filter: blur(10px);
  }
  #tools.show { display: block; }
  #keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #keys button {
    height: 54px; padding: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
    border-radius: 11px; border: 1px solid rgba(255, 255, 255, .10);
    background: rgba(28, 32, 41, .9); color: #dfe4ee; font-size: 9.5px;
  }
  #keys button svg {
    width: 19px; height: 19px; stroke: currentColor; fill: none;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }
  #keys button span { line-height: 1; opacity: .8; }
  /* 新功能按钮用蓝色高亮，和纯键位区分开 */
  #keys button.hl { background: rgba(47, 109, 246, .20); border-color: rgba(47, 109, 246, .42); color: #cddcff; }
  #keys button.active { background: #2f6df6; border-color: #2f6df6; color: #fff; }
  #sendbar { display: none; gap: 6px; margin-bottom: 8px; }
  #sendbar.show { display: flex; }
  #text {
    flex: 1 1 auto; min-width: 0; height: 36px; padding: 0 12px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .14); background: rgba(20, 23, 30, .95);
    color: #e8eaef; font-size: 14px; outline: none;
  }
  #sendbar button {
    flex: 0 0 auto; min-width: 52px; height: 36px; padding: 0 12px;
    border-radius: 10px; border: 1px solid rgba(47, 109, 246, .5);
    background: rgba(47, 109, 246, .28); color: #d6e4ff; font-size: 12.5px;
  }
  #kbd { position: fixed; left: -9999px; top: 0; width: 10px; height: 10px; opacity: 0; }
  #hint {
    position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 25; max-width: 86%; padding: 8px 14px; border-radius: 10px;
    background: rgba(12,14,20,.92); border: 1px solid rgba(255,255,255,.12);
    font-size: 12px; color: #cfd4de; opacity: 0; transition: opacity .2s;
    pointer-events: none; text-align: center;
  }
  #hint.show { opacity: 1; }
  /* 全屏后原生标题栏隐藏，这里提供一个退出入口 */
  #exitfs {
    position: absolute; right: 12px; top: 56px; z-index: 24;
    display: none; padding: 8px 14px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.16); background: rgba(12,14,20,.82);
    color: #cfd4de; font-size: 12.5px; backdrop-filter: blur(8px);
  }
  #exitfs.show { display: block; }
</style>
</head>
<body>
<div id="stage">
<div id="screen"></div>
<div id="loading"><div class="spin"></div><div id="loadingText">正在连接…</div></div>
<div id="status" class="pill">未连接</div>
<button id="control">接管</button>
<button id="fab" aria-label="桌面工具">
  <svg class="main" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg>
  <svg class="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
<div id="tools">
  <div id="sendbar">
    <input id="text" placeholder="输入文字后点发送" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="send">发送</button>
  </div>
  <div id="keys">
    <button id="kb" class="hl"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg><span>键盘</span></button>
    <button id="rc" class="hl"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="5"/><path d="M12 6.5v4M17 9h0"/></svg><span>右键</span></button>
    <button id="paste" class="hl"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.6h6V4"/><path d="M9 11h6M9 15h4"/></svg><span>粘贴</span></button>
    <button id="rot" class="hl"><svg viewBox="0 0 24 24"><rect x="2.5" y="7" width="12" height="10" rx="2"/><path d="M18 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18 6.8v2.7h-2.7"/></svg><span>横屏</span></button>
    <button id="fs" class="hl"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>全屏</span></button>
    <button id="fit" class="hl"><svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg><span>适配</span></button>
    <button id="zi" class="hl"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M10.5 7.5v6M7.5 10.5h6M15.5 15.5L21 21"/></svg><span>放大</span></button>
    <button id="zo" class="hl"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M7.5 10.5h6M15.5 15.5L21 21"/></svg><span>缩小</span></button>
    <button id="zv"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 2.4 6.7"/><path d="M4 4.5v5.5h5.5"/></svg><span class="lab">100%</span></button>
    <button data-k="0xff1b"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 9l6 6M15 9l-6 6"/></svg><span>Esc</span></button>
    <button data-k="0xff09"><svg viewBox="0 0 24 24"><path d="M4 6v12M20 6v12"/><path d="M7.5 12h9"/><path d="M13.5 9l3 3-3 3"/></svg><span>Tab</span></button>
    <button data-mod="0xffe3"><svg viewBox="0 0 24 24"><path d="M4 6v12M20 6v12"/><path d="M7 15l5-6 5 6"/></svg><span>Ctrl</span></button>
    <button data-mod="0xffe9"><svg viewBox="0 0 24 24"><path d="M12 5l6 14H6z"/><path d="M9 15h6"/></svg><span>Alt</span></button>
    <button data-k="0xff51"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>左</span></button>
    <button data-k="0xff52"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span>上</span></button>
    <button data-k="0xff53"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span>右</span></button>
    <button data-k="0xff54"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg><span>下</span></button>
    <button data-k="0xff0d"><svg viewBox="0 0 24 24"><path d="M20 5v7a3 3 0 0 1-3 3H5"/><path d="M9 11l-4 4 4 4"/></svg><span>Enter</span></button>
    <button data-k="0xff08"><svg viewBox="0 0 24 24"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9L3 12z"/><path d="M12 9l4 6M16 9l-4 6"/></svg><span>退格</span></button>
  </div>
</div>
<div id="hint"></div>
<button id="exitfs">退出全屏</button>
<input id="kbd" inputmode="text">
</div>

<script src="novnc.bundle.js"></script>
<script>
(function () {
  'use strict';
  /* 有些 Android WebView（尤其应用分身/分应用环境）在前台也把页面报成 hidden，
     Chromium 会因此暂停合成，noVNC 的画面就永远上不了屏。这里强制按可见处理。 */
  (function visibilityFix() {
    function def(name, value) {
      try {
        Object.defineProperty(Document.prototype, name, {
          configurable: true,
          get: function () { return value; }
        });
      } catch (e) {}
    }
    def('hidden', false);
    def('visibilityState', 'visible');
    def('webkitHidden', false);
    def('webkitVisibilityState', 'visible');
  })();

  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $('status'), controlEl = $('control'), toolsEl = $('tools'), fabEl = $('fab');
  var hintEl = $('hint'), textEl = $('text'), sendbarEl = $('sendbar'), kbdEl = $('kbd');
  var loadingEl = $('loading'), loadingTextEl = $('loadingText');

  /* loading 由上下文决定：连接中/重连中显示，连上或报错隐藏 */
  function sizeLoading() {
    var b = viewportBox();
    if (b.ok) {
      loadingEl.style.width = b.w + 'px';
      loadingEl.style.height = b.h + 'px';
    }
  }
  function setLoading(show, text) {
    loadingEl.classList.toggle('hide', !show);
    if (show) sizeLoading();
    if (show && text) loadingTextEl.textContent = text;
  }
  sizeLoading();

  var ctx = null, ws = null, rfb = null, viewerId = null;
  var seq = 0, pending = {}, lease = false, viewOnly = true, closing = false;
  var retry = 0, retryTimer = null, busy = false;
  var mods = {};  // keysym -> true while held
  var hintTimer = null;
  var dispMsgs = 0, dispBytes = 0;
  /* 放大/平移：靠放大 #screen 的布局尺寸让 noVNC 重新适配（不能用 CSS transform，
     否则 getBoundingClientRect 变大，_scale 跟着变，点击坐标会算错）。 */
  var ZOOMS = [1, 1.5, 2, 3];
  var zi = 0, panX = 0, panY = 0;
  var fullscreenOn = false, landscapeOn = false;

  /* 统计画面 WebSocket 收到的消息：判断「帧没来」还是「来了没画上」 */
  (function wrapWs() {
    var WS = window.WebSocket;
    if (typeof WS !== 'function') return;
    function Wrapped(url, protocols) {
      var sock = protocols ? new WS(url, protocols) : new WS(url);
      if (String(url).indexOf('/api/display/ws') >= 0) {
        dispMsgs = 0;
        dispBytes = 0;
        sock.addEventListener('message', function (ev) {
          dispMsgs++;
          var d = ev.data;
          dispBytes += (d && (d.byteLength || d.length)) || 0;
        });
      }
      return sock;
    }
    Wrapped.prototype = WS.prototype;
    Wrapped.CONNECTING = WS.CONNECTING;
    Wrapped.OPEN = WS.OPEN;
    Wrapped.CLOSING = WS.CLOSING;
    Wrapped.CLOSED = WS.CLOSED;
    window.WebSocket = Wrapped;
  })();

  function post(state) {
    try { if (window.FluxHost) FluxHost.onState(JSON.stringify(state)); } catch (e) {}
  }
  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = 'pill' + (kind ? ' ' + kind : '');
    // 连接中/重连中显示居中动画；连上、出错、已断开都收起
    setLoading(!kind && text.indexOf('断开') < 0 && text.indexOf('中断') < 0, text);
  }
  /* 日志走两条路：原生（HttpURLConnection 上报）、bridge /log */
  function log(text, kind) {
    try { if (window.FluxHost && FluxHost.onLog) FluxHost.onLog(String(text)); } catch (e) {}
    try {
      if (!ctx || !ctx.bridge) return;
      var logUrl = ctx.bridge + '/log?key=' + encodeURIComponent(ctx.bridgeKey) +
        '&tag=' + encodeURIComponent(ctx.profile);
      if (window.FluxNet && FluxNet.request) {
        nativeHttp('POST', logUrl, String(text)).catch(function () {});
        return;
      }
      fetch(logUrl, { method: 'POST', mode: 'cors', keepalive: true, body: String(text) }).catch(function () {});
    } catch (e) {}
  }
  /* ---------------- 画面自检：区分「没画上」和「画上了但没上屏」 ---------------- */
  function sampleCanvas(canvas) {
    if (!canvas) return { w: 0, h: 0, nb: 0, total: 0, err: '无画布' };
    var w = canvas.width, h = canvas.height;
    if (!w || !h) return { w: w, h: h, nb: 0, total: 0, err: '尺寸0' };
    try {
      var data = canvas.getContext('2d').getImageData(0, 0, w, h).data;
      var sx = Math.max(1, Math.floor(w / 64)), sy = Math.max(1, Math.floor(h / 64));
      var nb = 0, total = 0;
      for (var y = 0; y < h; y += sy) {
        for (var x = 0; x < w; x += sx) {
          var i = (y * w + x) * 4;
          total++;
          if (data[i] > 6 || data[i + 1] > 6 || data[i + 2] > 6) nb++;
        }
      }
      return { w: w, h: h, nb: nb, total: total };
    } catch (e) {
      return { w: w, h: h, nb: 0, total: 0, err: (e && e.message) || '读取失败' };
    }
  }
  function probeCanvas(tag) {
    if (closing) return;
    var canvas = document.querySelector('#screen canvas');
    var d = rfb && rfb._display;
    var t = sampleCanvas(canvas), b = sampleCanvas(d && d._backbuffer);
    var rect = canvas ? canvas.getBoundingClientRect() : null;
    var css = canvas ? ((canvas.style.width || '-') + 'x' + (canvas.style.height || '-')) : '-';
    var box = rect ? (Math.round(rect.width) + 'x' + Math.round(rect.height)) : '-';
    var vp = (d && d._viewportLoc) ? (d._viewportLoc.w + 'x' + d._viewportLoc.h) : '-';
    var top = '?';
    try {
      var el = document.elementFromPoint(Math.round(innerWidth / 2), Math.round(innerHeight / 2));
      top = el ? (el.tagName + (el.id ? '#' + el.id : '')) : '空';
    } catch (e) {}
    log(tag + ' 画布 ' + t.w + 'x' + t.h + ' 亮=' + t.nb + '/' + t.total +
      ' 背板=' + b.nb + '/' + b.total + ' 视口=' + vp + ' css=' + css +
      ' 显示=' + box + ' 顶层=' + top + ' 可见=' + document.visibilityState +
      ' 帧=' + dispMsgs + '/' + Math.round(dispBytes / 1024) + 'KB' +
      (t.err ? ' 读错=' + t.err : ''));
  }

  /* 有些 WebView 里 #screen 量出来是 0（inset 兼容性/布局时机），
     noVNC 会据此把画布缩放成 0。这里兜底：量不到尺寸就用窗口尺寸补上，再强制重算缩放。 */
  function screenBox() {
    var box = $('screen');
    if (!box) return null;
    var r = box.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) {
      var b = viewportBox();
      if (b.ok) {
        box.style.position = 'absolute';
        box.style.left = '0'; box.style.top = '0';
        box.style.width = b.w + 'px'; box.style.height = b.h + 'px';
        r = box.getBoundingClientRect();
      }
    }
    return r;
  }
  /* 可见视口尺寸：优先用原生 WebView 的真实像素尺寸（最准），
     其次量 #stage（fixed + 100vw/100vh），最后退回 client/inner 尺寸。
     window.innerHeight 在个别 WebView 里会大于实际可见高度，
     用它会算偏 #screen，让底部工具条跑到屏幕外。 */
  var nativeBox = null;
  function viewportBox() {
    if (nativeBox) return nativeBox;
    var st = $('stage'), r = st ? st.getBoundingClientRect() : null;
    var w = r ? Math.round(r.width) : 0, h = r ? Math.round(r.height) : 0;
    if (w < 2 || h < 2) {
      w = Math.round(document.documentElement.clientWidth || window.innerWidth);
      h = Math.round(document.documentElement.clientHeight || window.innerHeight);
    }
    if (w < 2 || h < 2) {
      w = Math.round(window.innerWidth); h = Math.round(window.innerHeight);
    }
    return { w: w, h: h, ok: w > 1 && h > 1 };
  }
  /* 原生在布局变化时把 WebView 的物理像素尺寸传进来（横屏/全屏/键盘最可靠） */
  function setViewport(pxW, pxH) {
    var dpr = window.devicePixelRatio || 1;
    var w = Math.round(pxW / dpr), h = Math.round(pxH / dpr);
    if (!(w > 1 && h > 1)) return;
    nativeBox = { w: w, h: h, ok: true };
    var st = $('stage');
    if (st) { st.style.width = w + 'px'; st.style.height = h + 'px'; }
    sizeLoading();
    applyView();
    refit('原生视口');
  }
  /* 把当前缩放/平移写进 #screen 的布局尺寸与左上角位置。
     放大时 #screen 比窗口大，noVNC 会按更大的容器重新适配，画面自然变大；平移只改 left/top。 */
  function applyView() {
    var el = $('screen');
    if (!el) return;
    var b = viewportBox();
    if (!b.ok) return;
    var z = ZOOMS[zi];
    el.style.right = 'auto'; el.style.bottom = 'auto';
    if (z <= 1.001) {
      zi = 0; panX = 0; panY = 0;
      if (rfb) { try { rfb.dragViewport = false; } catch (e) {} }
      el.style.left = '0px'; el.style.top = '0px';
      el.style.width = b.w + 'px'; el.style.height = b.h + 'px';
    } else {
      var w = Math.round(b.w * z), h = Math.round(b.h * z);
      var minX = b.w - w, minY = b.h - h;
      if (panX > 0) panX = 0;
      if (panY > 0) panY = 0;
      if (panX < minX) panX = minX;
      if (panY < minY) panY = minY;
      /* 放大时把拖动交给本地平移，别把拖动当远程拖拽发过去（点按/长按仍会发） */
      if (rfb) { try { rfb.dragViewport = true; } catch (e) {} }
      el.style.left = Math.round(panX) + 'px';
      el.style.top = Math.round(panY) + 'px';
      el.style.width = w + 'px'; el.style.height = h + 'px';
    }
    var zv = $('zv'), lab = zv ? zv.querySelector('.lab') : null;
    if (lab) lab.textContent = Math.round(z * 100) + '%';
  }
  function setZoom(next) {
    next = Math.max(0, Math.min(ZOOMS.length - 1, next));
    if (next === zi) {
      if (next === 0) hint('已经是适配大小');
      else hint('放大 ' + Math.round(ZOOMS[zi] * 100) + '%（单指拖动画面）');
      return;
    }
    var keepX = 0, keepY = 0;
    var b = viewportBox();
    var oz = ZOOMS[zi];
    if (b.ok && oz > 1.001) {
      // 保持当前视口中心指向的点不跳
      keepX = (b.w / 2 - panX) / oz;
      keepY = (b.h / 2 - panY) / oz;
    }
    zi = next;
    var z = ZOOMS[zi];
    if (z > 1.001) {
      panX = b.ok ? Math.round(b.w / 2 - keepX * z) : 0;
      panY = b.ok ? Math.round(b.h / 2 - keepY * z) : 0;
    } else {
      panX = 0; panY = 0;
    }
    refit('缩放');
    hint(z <= 1.001 ? '已适配屏幕' : '放大 ' + Math.round(z * 100) + '%（单指拖动画面）');
  }
  /* 放大状态下单指拖动平移。noVNC 在手势层会 stopPropagation，
     所以必须挂在捕获阶段才能先拿到事件。 */
  (function panSetup() {
    var el = $('screen');
    var active = false, pid = -1, sx = 0, sy = 0, ox = 0, oy = 0;
    function findTouch(list) {
      for (var i = 0; i < list.length; i++) if (list[i].identifier === pid) return list[i];
      return null;
    }
    el.addEventListener('touchstart', function (ev) {
      if (ZOOMS[zi] <= 1.001 || ev.touches.length !== 1) { active = false; return; }
      var t = ev.touches[0];
      active = true; pid = t.identifier;
      sx = t.clientX; sy = t.clientY; ox = panX; oy = panY;
    }, true);
    el.addEventListener('touchmove', function (ev) {
      if (!active) return;
      var t = findTouch(ev.touches);
      if (!t) return;
      panX = ox + (t.clientX - sx);
      panY = oy + (t.clientY - sy);
      applyView();
      ev.preventDefault();
    }, true);
    el.addEventListener('touchend', function (ev) {
      if (!findTouch(ev.touches)) active = false;
    }, true);
    el.addEventListener('touchcancel', function () { active = false; }, true);
  })();

  function refit(reason) {
    if (!rfb || closing) return;
    applyView();                                    // 先摆好容器尺寸/位置，再让 noVNC 重新适配
    try { rfb.scaleViewport = true; } catch (e) {}   // setter 内部会 _updateScale()
    try { if (rfb._updateScale) rfb._updateScale(); } catch (e) {}
    applyView();                                    // 尺寸边界可能变了，再收敛一次
    var r = screenBox();
    var c = document.querySelector('#screen canvas');
    var w = c ? c.style.width : '-';
    if (reason || w === '0px' || !w) {
      var now = Date.now();
      if (reason || now - lastRefitLog > 8000) {
        lastRefitLog = now;
        var vb = viewportBox();
        log('重算缩放(' + (reason || '看门狗') + ') 容器=' +
          (r ? (Math.round(r.width) + 'x' + Math.round(r.height)) : '无') +
          ' 视口=' + vb.w + 'x' + vb.h +
          ' 窗口=' + window.innerWidth + 'x' + window.innerHeight +
          ' 缩放=' + Math.round(ZOOMS[zi] * 100) + '% css=' + w);
      }
    }
  }
  var lastRefitLog = 0;

  /* 原生 HTTP 兜底：WebView 的 fetch 被拦时改走原生 HttpURLConnection（仍在客户端，不经中转） */
  var httpSeq = 0, httpWaiters = {};
  function nativeHttp(method, url, body) {
    return new Promise(function (resolve, reject) {
      if (!(window.FluxNet && FluxNet.request)) { reject(new Error('原生 HTTP 不可用')); return; }
      var id = 'h' + (++httpSeq);
      httpWaiters[id] = { resolve: resolve, reject: reject };
      setTimeout(function () {
        if (httpWaiters[id]) { delete httpWaiters[id]; reject(new Error('原生请求超时')); }
      }, 95000);
      try { FluxNet.request(id, method, url, body || ''); }
      catch (e) { delete httpWaiters[id]; reject(e); }
    });
  }
  function settleHttp(id, ok, text) {
    var w = httpWaiters[id];
    if (!w) return;
    delete httpWaiters[id];
    if (String(ok) === '1') w.resolve(String(text));
    else w.reject(new Error(String(text) || '原生请求失败'));
  }
  function hint(text) {
    hintEl.textContent = text;
    hintEl.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { hintEl.classList.remove('show'); }, 2600);
  }
  function applyViewOnly() {
    if (rfb) rfb.viewOnly = viewOnly;
    controlEl.textContent = viewOnly ? '接管' : '交还';
    controlEl.className = viewOnly ? '' : 'on';
    /* 连上画面就把悬浮球露出来（未接管时点按钮会提示先接管），保证入口可见 */
    showTools(!!rfb);
    post({ phase: 'ready', text: viewOnly ? '观看中' : '已接管', control: !viewOnly });
  }

  /* ---------------- 收尾 / 自动重连 ---------------- */
  function flushPending(reason) {
    Object.keys(pending).forEach(function (k) {
      var p = pending[k];
      delete pending[k];
      try { p.reject(new Error(reason)); } catch (e) {}
    });
  }
  function teardown() {
    flushPending('连接已断开');
    if (rfb) {
      var r = rfb;
      rfb = null;
      try { r.disconnect(); } catch (e) {}
    }
    var target = $('screen');
    if (target) target.innerHTML = '';
    if (ws) {
      var w = ws;
      ws = null;
      w.onopen = null; w.onmessage = null; w.onerror = null; w.onclose = null;
      try { w.close(); } catch (e) {}
    }
    mods = {};
    showTools(false);
  }
  function scheduleReconnect(reason) {
    if (closing || retryTimer) return;
    retry++;
    if (retry > 10) {
      setStatus('连接中断', 'err');
      post({ phase: 'error', text: '连接中断：' + reason });
      log('放弃重连：' + reason, 'err');
      return;
    }
    var wait = Math.min(1000 + 900 * retry, 10000);
    setStatus('正在重连 (' + retry + '/10)…');
    post({ phase: 'connecting', text: '正在重连 (' + retry + '/10)…' });
    log('第 ' + retry + ' 次重连，' + wait + 'ms 后：' + reason);
    teardown();
    retryTimer = setTimeout(function () {
      retryTimer = null;
      if (!closing) run();
    }, wait);
  }

  /* ---------------- JSON-RPC over the gateway WebSocket ---------------- */
  function rpc(method, params, timeoutMs) {
    return new Promise(function (resolve, reject) {
      if (!ws || ws.readyState !== 1) { reject(new Error('网关未连接')); return; }
      var id = ++seq;
      var body = { jsonrpc: '2.0', id: id, method: method, params: params || {} };
      body.params.profile = ctx.profile;
      pending[id] = { resolve: resolve, reject: reject, method: method };
      ws.send(JSON.stringify(body));
      log('→ ' + method);
      setTimeout(function () {
        if (pending[id]) { delete pending[id]; reject(new Error(method + ' 超时')); }
      }, timeoutMs || 90000);
    });
  }

  function openGateway() {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var done = function (fn, arg) { if (!settled) { settled = true; fn(arg); } };
      var url = 'wss://' + ctx.host + '/api/ws?token=' + encodeURIComponent(ctx.token);
      var sock = ws = new WebSocket(url);
      sock.onopen = function () { log('网关已打开'); };
      sock.onmessage = function (ev) {
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (msg.id != null && pending[msg.id]) {
          var p = pending[msg.id];
          delete pending[msg.id];
          if (msg.error) {
            log('← ' + p.method + ' 失败 ' + ((msg.error && msg.error.message) || ''), 'err');
            p.reject(new Error((msg.error && msg.error.message) || '请求失败'));
          } else {
            log('← ' + p.method + ' 成功');
            p.resolve(msg.result);
          }
          return;
        }
        var params = msg.params || {};
        if (params.type === 'gateway.ready') { log('网关就绪'); done(resolve); }
      };
      sock.onerror = function () { log('网关连接出错', 'err'); done(reject, new Error('无法连接网关')); };
      sock.onclose = function (ev) {
        log('网关关闭 code=' + ev.code + (ev.reason ? ' ' + ev.reason : ''), settled ? 'err' : undefined);
        flushPending('网关已关闭');
        if (!settled) { done(reject, new Error('网关已关闭 (' + ev.code + ')')); return; }
        if (!closing) scheduleReconnect('gateway ' + ev.code);
      };
      setTimeout(function () { done(reject, new Error('网关连接超时')); }, 15000);
    });
  }

  /* ---------------- bridge：把 bot 的浏览器窗口拉回来 ---------------- */
  function bridgeStart() {
    if (!ctx.bridge) return Promise.resolve();
    var url = ctx.bridge + '/desktop/start?key=' + encodeURIComponent(ctx.bridgeKey) +
      '&profile=' + encodeURIComponent(ctx.profile);
    log('准备桌面');
    var p;
    if (window.FluxNet && FluxNet.request) {
      p = nativeHttp('POST', url, '').then(function (txt) {
        return { status: 200, ok: true, text: txt, via: 'native' };
      });
    } else {
      var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 90000);
      var opt = { method: 'POST', mode: 'cors' };
      if (ctrl) opt.signal = ctrl.signal;
      p = fetch(url, opt).then(function (res) {
        return res.text().then(function (txt) {
          return { status: res.status, ok: res.ok, text: txt, via: 'fetch' };
        });
      }).then(function (r) {
        clearTimeout(timer);
        return r;
      }, function (e) {
        clearTimeout(timer);
        throw e;
      });
    }
    return p.then(function (r) {
      log('桌面 ' + r.status + ' ' + String(r.text).replace(/\s+/g, ' ').slice(0, 100) + ' (' + r.via + ')',
        r.ok ? undefined : 'err');
    }).catch(function (err) {
      log('桌面准备失败 ' + ((err && err.message) || err), 'err');
    });
  }

  /* ---------------- screen ---------------- */
  function acquireLease() {
    return rpc('display.lease.acquire', { viewer_id: viewerId }, 15000).then(function () {
      lease = true;
      viewOnly = false;
      applyViewOnly();
      hint('已接管，可以直接点按操作');
    }).catch(function (err) {
      lease = false;
      viewOnly = true;
      applyViewOnly();
      hint('接管失败：' + err.message);
    });
  }

  function attach() {
    return rpc('display.observe', {}).then(function (obs) {
      viewerId = obs.viewer_id;
      var url = 'wss://' + ctx.host + '/api/display/ws?display_ticket=' + encodeURIComponent(obs.ticket);
      return new Promise(function (resolve, reject) {
        var target = $('screen');
        target.innerHTML = '';
        var self = new RFB(target, url, { shared: true, credentials: {} });
        rfb = self;
        self.scaleViewport = true;
        self.clipViewport = false;
        self.resizeSession = false;
        self.viewOnly = viewOnly;
        /* 桌面复制 → 手机剪贴板（noVNC 在 viewOnly 时不派发该事件，所以接管后才有） */
        self.addEventListener('clipboard', function (ev) {
          var text = ev && ev.detail && ev.detail.text;
          if (!text) return;
          try {
            if (window.FluxHost && FluxHost.setClipboard) FluxHost.setClipboard(String(text));
          } catch (e) {}
          hint('桌面剪贴板已同步到手机');
        });
        var settled = false;
        var settle = function (fn, arg) { if (!settled) { settled = true; fn(arg); } };
        self.addEventListener('connect', function () {
          if (rfb !== self) return;
          log('画面已连接');
          setStatus('已连接', 'ok');
          applyViewOnly();
          hint(viewOnly ? '已连接，点右下角悬浮球展开工具栏' : '已接管，点悬浮球展开工具栏');
          settle(resolve);
          if (!viewOnly) acquireLease();
          refit('连接后');
          setTimeout(function () { refit('300ms'); }, 300);
          setTimeout(function () { refit('1200ms'); }, 1200);
          setTimeout(function () { probeCanvas('自检3s'); }, 3000);
          setTimeout(function () { probeCanvas('自检9s'); }, 9000);
        });
        self.addEventListener('disconnect', function (ev) {
          if (rfb !== self) return;   // 已被 teardown 顶替
          rfb = null;
          var d = ev.detail || {};
          if (closing) return;
          log('画面断开 clean=' + !!d.clean + ' code=' + (d.code || '?'), 'err');
          if (d.clean) {
            setStatus('已断开');
            post({ phase: 'closed', text: '已断开' });
          } else {
            setStatus('画面中断，正在重连…', 'err');
            post({ phase: 'error', text: '画面连接中断（' + (d.code || '?') + '）' });
          }
          settle(reject, new Error('画面连接中断（' + (d.code || '?') + '）'));
          scheduleReconnect('screen ' + (d.code || '?'));
        });

          if (rfb !== self) return;
          var reason = (ev.detail && ev.detail.reason) || '';
          log('安全协商失败 ' + reason, 'err');
          setStatus('安全协商失败', 'err');
          settle(reject, new Error('安全协商失败: ' + reason));
        });
        setTimeout(function () { settle(reject, new Error('画面连接超时')); }, 30000);
      });
    });
  }

  function attempt() {
    setStatus('连接中…');
    post({ phase: 'connecting', text: '连接中…' });
    return bridgeStart()
      .then(function () {
        setStatus('连接网关…');
        return openGateway();
      })
      .then(function () {
        setStatus('检查桌面…');
        return rpc('display.status', {});
      })
      .then(function (st) {
        if (st && st.running) return;
        if (st && st.blocker) {
          var e = new Error(st.blocker);
          e.fatal = true;
          throw e;
        }
        setStatus('启动桌面…');
        post({ phase: 'starting', text: '启动桌面…' });
        log('启动桌面');
        return rpc('display.start', {}, 150000);
      })
      .then(function () {
        setStatus('连接画面…');
        return attach();
      })
      .then(function () {
        retry = 0;
      });
  }

  function run() {
    busy = true;
    attempt().then(function () {
      busy = false;
    }, function (err) {
      busy = false;
      var msg = (err && err.message) || '连接失败';
      if (closing) return;
      log('连接失败：' + msg, 'err');
      if (err && err.fatal) {
        setStatus(msg, 'err');
        post({ phase: 'error', text: msg });
        return;
      }
      scheduleReconnect(msg);
    });
  }

  function start(cfg) {
    ctx = cfg;
    closing = false;
    lease = false;
    viewOnly = true;
    retry = 0;
    busy = false;
    setLoading(true, '正在连接…');
    clearTimeout(retryTimer);
    retryTimer = null;
    teardown();
    log('连接 ' + ctx.profile);
    run();
  }

  /* ---------------- lease ---------------- */
  function takeover() {
    if (!rfb) { hint('画面还没连上'); return; }
    acquireLease();
  }
  function release() {
    allModsUp();
    if (!lease) { viewOnly = true; applyViewOnly(); return; }
    rpc('display.lease.release', { viewer_id: viewerId }, 15000).catch(function () {
    }).then(function () {
      lease = false;
      viewOnly = true;
      applyViewOnly();
    });
  }

  /* ---------------- keys ---------------- */
  function sendKey(keysym) {
    if (!rfb || viewOnly) { hint('先点「接管」'); return; }
    rfb.sendKey(keysym, null, true);
    rfb.sendKey(keysym, null, false);
  }
  function allModsUp() {
    Object.keys(mods).forEach(function (ks) {
      if (rfb) rfb.sendKey(Number(ks), null, false);
      delete mods[ks];
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-mod]'), function (b) {
      b.classList.remove('active');
    });
  }
  function sendText(text) {
    if (!rfb || viewOnly) { hint('先点「接管」'); return; }
    var nonAscii = '';
    for (var i = 0; i < text.length; i++) {
      var ch = text[i], cp = text.codePointAt(i);
      if (cp > 0xffff) i++;
      if (cp === 0x0a) { sendKey(0xff0d); }
      else if (cp < 0x80) {
        var ks = cp;
        Object.keys(mods).forEach(function (m) { rfb.sendKey(Number(m), null, true); });
        rfb.sendKey(ks, null, true);
        rfb.sendKey(ks, null, false);
        Object.keys(mods).forEach(function (m) { rfb.sendKey(Number(m), null, false); });
      } else {
        nonAscii += String.fromCodePoint(cp);
      }
    }
    if (nonAscii) {
      rfb.clipboardPasteFrom(nonAscii);
      hint('中文已放进桌面剪贴板，在桌面里按 Ctrl+V 粘贴');
    }
  }

  /* ---------------- 悬浮球 / 工具面板 ---------------- */
  var FAB_SIZE = 50, FAB_MARGIN = 8, toolsOpen = false;
  function clampNum(v, min, max) { return v < min ? min : (v > max ? max : v); }
  function fabVisible() { return fabEl.classList.contains('show'); }
  function setFabPos(x, y) {
    var b = viewportBox();
    if (!b.ok) return;
    var px = clampNum(x, FAB_MARGIN, Math.max(FAB_MARGIN, b.w - FAB_SIZE - FAB_MARGIN));
    var py = clampNum(y, FAB_MARGIN, Math.max(FAB_MARGIN, b.h - FAB_SIZE - FAB_MARGIN));
    fabEl.style.right = 'auto';
    fabEl.style.bottom = 'auto';
    fabEl.style.left = Math.round(px) + 'px';
    fabEl.style.top = Math.round(py) + 'px';
  }
  function defaultFabPos() {
    var b = viewportBox();
    /* 默认右下角，避开底部提示条 */
    setFabPos(b.w - FAB_SIZE - 14, b.h - FAB_SIZE - 96);
  }
  function saveFabPos() {
    try {
      var b = viewportBox();
      if (!b.ok) return;
      var r = fabEl.getBoundingClientRect();
      localStorage.setItem('flux.fab', JSON.stringify({ x: r.left / b.w, y: r.top / b.h }));
    } catch (e) {}
  }
  function loadFabPos() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('flux.fab') || 'null'); } catch (e) {}
    var b = viewportBox();
    if (b.ok && saved && typeof saved.x === 'number' && typeof saved.y === 'number') {
      setFabPos(saved.x * b.w, saved.y * b.h);
    } else {
      defaultFabPos();
    }
  }
  /* 面板贴着球放：优先左侧，空间不够就右侧，纵向以球为中心并夹在屏幕内 */
  function positionTools() {
    if (!toolsOpen || !fabVisible()) return;
    var b = viewportBox();
    var fr = fabEl.getBoundingClientRect();
    var tw = toolsEl.offsetWidth || 246, th = toolsEl.offsetHeight || 220, gap = 10;
    var left = fr.left - tw - gap;
    if (left < FAB_MARGIN) left = fr.right + gap;
    if (left + tw > b.w - FAB_MARGIN) left = b.w - tw - FAB_MARGIN;
    if (left < FAB_MARGIN) left = FAB_MARGIN;
    var top = fr.top + fr.height / 2 - th / 2;
    top = clampNum(top, FAB_MARGIN, Math.max(FAB_MARGIN, b.h - th - FAB_MARGIN));
    toolsEl.style.left = Math.round(left) + 'px';
    toolsEl.style.top = Math.round(top) + 'px';
  }
  function toggleTools(force) {
    toolsOpen = typeof force === 'boolean' ? force : !toolsOpen;
    toolsEl.classList.toggle('show', toolsOpen);
    fabEl.classList.toggle('open', toolsOpen);
    if (toolsOpen) positionTools();
  }
  function showTools(on) {
    fabEl.classList.toggle('show', !!on);
    if (!on) { toggleTools(false); return; }
    loadFabPos();
    positionTools();
  }
  function reflowFab() {
    if (!fabVisible()) return;
    var r = fabEl.getBoundingClientRect();
    setFabPos(r.left, r.top);
    positionTools();
  }
  (function fabSetup() {
    var down = false, moved = false, sx = 0, sy = 0, offX = 0, offY = 0;
    fabEl.addEventListener('pointerdown', function (e) {
      if (e.button !== undefined && e.button !== 0) return;
      down = true; moved = false;
      sx = e.clientX; sy = e.clientY;
      var r = fabEl.getBoundingClientRect();
      offX = e.clientX - r.left; offY = e.clientY - r.top;
      try { fabEl.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault(); e.stopPropagation();
    });
    fabEl.addEventListener('pointermove', function (e) {
      if (!down) return;
      if (!moved && (Math.abs(e.clientX - sx) > 6 || Math.abs(e.clientY - sy) > 6)) moved = true;
      if (!moved) return;
      setFabPos(e.clientX - offX, e.clientY - offY);
      if (toolsOpen) positionTools();
      e.preventDefault();
    });
    fabEl.addEventListener('pointerup', function (e) {
      if (!down) return;
      down = false;
      /* 拖动超过阈值就是移动，否则按点击处理 */
      if (moved) saveFabPos(); else toggleTools();
      e.preventDefault();
    });
    fabEl.addEventListener('pointercancel', function () { down = false; });
    fabEl.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    /* 点画面空白处收起面板，避免长期挡住桌面 */
    document.addEventListener('pointerdown', function (e) {
      if (!toolsOpen) return;
      if (fabEl.contains(e.target) || toolsEl.contains(e.target)) return;
      toggleTools(false);
    }, true);
  })();

  /* ---------------- wiring ---------------- */
  controlEl.addEventListener('click', function () { viewOnly ? takeover() : release(); });
  statusEl.addEventListener('click', function () {
    if (statusEl.classList.contains('err')) window.Flux.reconnect();
  });
  Array.prototype.forEach.call(document.querySelectorAll('#keys [data-k]'), function (b) {
    b.addEventListener('click', function () { if (viewOnly) { hint('先点「接管」'); return; } sendKey(Number(b.dataset.k)); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#keys [data-mod]'), function (b) {
    b.addEventListener('click', function () {
      if (!rfb || viewOnly) { hint('先点「接管」'); return; }
      var ks = b.dataset.mod;
      if (mods[ks]) { rfb.sendKey(Number(ks), null, false); delete mods[ks]; b.classList.remove('active'); }
      else { rfb.sendKey(Number(ks), null, true); mods[ks] = true; b.classList.add('active'); }
    });
  });
  $('kb').addEventListener('click', function () {
    if (viewOnly) { hint('先点「接管」'); return; }
    sendbarEl.classList.toggle('show');
    positionTools();
    if (sendbarEl.classList.contains('show')) {
      textEl.focus(); kbdEl.focus();
      /* 部分 WebView 里页面内 focus 拉不起软键盘，交给原生强制弹一次 */
      try { if (window.FluxHost && FluxHost.showKeyboard) FluxHost.showKeyboard(); } catch (e) {}
    }
  });
  $('send').addEventListener('click', function () {
    if (textEl.value) { sendText(textEl.value); textEl.value = ''; }
    kbdEl.focus();
  });
  kbdEl.addEventListener('input', function () {
    var v = kbdEl.value;
    kbdEl.value = '';
    if (v) sendText(v);
  });
  $('fit').addEventListener('click', function () {
    if (!rfb) return;
    zi = 0; panX = 0; panY = 0;
    refit('手动适配');
    hint('已适配屏幕');
  });
  $('zi').addEventListener('click', function () { setZoom(zi + 1); });
  $('zo').addEventListener('click', function () { setZoom(zi - 1); });
  $('zv').addEventListener('click', function () { setZoom(0); });
  /* 右键：发到当前可见区域的中心 */
  $('rc').addEventListener('click', function () {
    if (!rfb || viewOnly) { hint('先点「接管」'); return; }
    var c = document.querySelector('#screen canvas');
    if (!c) return;
    var r = c.getBoundingClientRect();
    var b = viewportBox();
    var x = Math.round(b.w / 2 - r.left);
    var y = Math.round(b.h / 2 - r.top);
    if (x < 0 || y < 0 || x > r.width || y > r.height) { hint('画面中心不在可见区域'); return; }
    try {
      rfb._handleMouseButton(x, y, true, 4);
      rfb._handleMouseButton(x, y, false, 4);
      hint('已发送右键');
    } catch (e) { hint('右键失败'); }
  });
  /* 手机剪贴板 → 桌面 */
  $('paste').addEventListener('click', function () {
    if (!rfb || viewOnly) { hint('先点「接管」'); return; }
    var text = '';
    try { if (window.FluxHost && FluxHost.getClipboard) text = FluxHost.getClipboard() || ''; } catch (e) {}
    if (!text) { hint('手机剪贴板是空的'); return; }
    rfb.clipboardPasteFrom(String(text));
    hint('已放进桌面剪贴板，在桌面里 Ctrl+V 粘贴');
  });
  /* 横屏 / 全屏交给原生处理，布局变完再重算画面 */
  $('rot').addEventListener('click', function () {
    landscapeOn = !landscapeOn;
    $('rot').classList.toggle('active', landscapeOn);
    try { if (window.FluxHost && FluxHost.setLandscape) FluxHost.setLandscape(landscapeOn ? 1 : 0); } catch (e) {}
    setTimeout(function () { refit('旋转'); }, 500);
    setTimeout(function () { refit('旋转2'); }, 1100);
  });
  function setFullscreenUI(on) {
    fullscreenOn = on;
    var fs = $('fs'), ex = $('exitfs');
    if (fs) fs.classList.toggle('active', on);
    if (ex) ex.classList.toggle('show', on);
  }
  function sendFullscreen(on) {
    try { if (window.FluxHost && FluxHost.setFullscreen) FluxHost.setFullscreen(on ? 1 : 0); } catch (e) {}
    setTimeout(function () { refit('全屏'); }, 400);
    setTimeout(function () { refit('全屏2'); }, 1000);
  }
  $('fs').addEventListener('click', function () {
    setFullscreenUI(!fullscreenOn);
    sendFullscreen(fullscreenOn);
  });
  $('exitfs').addEventListener('click', function () {
    setFullscreenUI(false);
    sendFullscreen(false);
  });
  window.addEventListener('resize', function () { applyView(); refit('窗口变化'); sizeLoading(); reflowFab(); });
  window.addEventListener('orientationchange', function () { setTimeout(function () { applyView(); refit('旋转'); reflowFab(); }, 400); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () { applyView(); refit('视口变化'); reflowFab(); });
  }
  window.addEventListener('beforeunload', function () { window.Flux.disconnect(); });
  window.addEventListener('pagehide', function () { window.Flux.disconnect(); });

  /* 息屏/切后台回来、或画面悄悄掉了：拉回来 */
  document.addEventListener('visibilitychange', function () {
    if (closing) return;
    log('可见性 ' + document.visibilityState);
    if (document.visibilityState !== 'visible') return;
    if (busy || retryTimer) return;
    if (!ws || ws.readyState !== 1 || !rfb) {
      retry = 0;
      scheduleReconnect('回到前台');
    }
  });
  setInterval(function () {
    if (closing || busy || retryTimer) return;
    if (document.visibilityState !== 'visible') return;
    if (!ws || ws.readyState !== 1 || !rfb) scheduleReconnect('心跳检查');
  }, 20000);

  /* 兜底：帧已经到了背板但没翻到可见画布时，定期手动翻一次 */
  setInterval(function () {
    if (closing || !rfb || !rfb._display) return;
    try {
      var d = rfb._display;
      if (d._renderQ.length > 0) return;
      var b = d._damageBounds;
      if (b && b.right > b.left && b.bottom > b.top) d.flip(true);
    } catch (e) {}
  }, 700);

  /* 兜底：画布被缩放成 0 像素时（容器量不到尺寸），持续尝试重算 */
  setInterval(function () {
    if (closing || !rfb) return;
    var c = document.querySelector('#screen canvas');
    if (!c) return;
    var r = c.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) refit(null);
  }, 1200);

  /* 首帧就把 #screen 的尺寸/位置写成 px（ZOOMS 到这里已初始化） */
  applyView();

  /* ---------------- native entry points ---------------- */
  window.Flux = {
    connect: function (host, token, profile, bridge, bridgeKey) {
      window.Flux.disconnect();
      start({ host: host, token: token, profile: profile, bridge: bridge, bridgeKey: bridgeKey });
    },
    reconnect: function () {
      if (!ctx) return;
      var c = ctx;
      window.Flux.connect(c.host, c.token, c.profile, c.bridge, c.bridgeKey);
    },
    takeover: takeover,
    release: release,
    /* 原生布局变化（横屏/全屏/键盘）后主动重算画面 */
    refit: function () { refit('原生通知'); },
    /* 原生传入 WebView 实际像素尺寸 */
    setViewport: setViewport,
    /* 原生探测结果（DNS/TCP/HTTPS）只进日志，不再显示在屏幕上 */
    diag: function (text) { log(String(text)); },
    /* 原生 HTTP 回调（见 FluxNet.request） */
    __http: settleHttp,
    disconnect: function () {
      closing = true;
      clearTimeout(retryTimer);
      retryTimer = null;
      if (lease && ws && ws.readyState === 1 && ctx) {
        try {
          ws.send(JSON.stringify({
            jsonrpc: '2.0', id: ++seq, method: 'display.lease.release',
            params: { profile: ctx.profile, viewer_id: viewerId }
          }));
        } catch (e) {}
      }
      lease = false;
      if (ctx) log('主动断开');
      if (rfb) { var r = rfb; rfb = null; try { r.disconnect(); } catch (e) {} }
      flushPending('已断开');
      if (ws) {
        var w = ws;
        ws = null;
        w.onopen = null; w.onmessage = null; w.onerror = null; w.onclose = null;
        try { w.close(); } catch (e) {}
      }
    }
  };
})();
</script>
</body>
</html>
